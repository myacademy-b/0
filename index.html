<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
<title>WORKDESK - Remote Jobs</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;max-width:100%;overflow-x:hidden}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
  background:
    radial-gradient(circle at top, rgba(59,130,246,.14), transparent 28%),
    radial-gradient(circle at 80% 10%, rgba(99,102,241,.12), transparent 22%),
    #0b0b0f;
  color:#fff;
  -webkit-tap-highlight-color:transparent;
  scroll-behavior:smooth;
  overflow-x:hidden;
  max-width:100vw;
}
img{max-width:100%;display:block}
button,input{font:inherit}

.jobs-section{
  background:transparent;
  padding:14px 12px 42px;
  position:relative;
  pointer-events:auto;
}
.jobs-section::before{
  content:'';
  position:absolute;
  inset:0;
  background:linear-gradient(180deg, rgba(255,255,255,.03), transparent 18%, transparent 82%, rgba(255,255,255,.02));
  pointer-events:none;
}
.jobs-container{
  position:relative;
  z-index:1;
  max-width:100%;
  margin:0 auto;
  pointer-events:auto;
}
.brand-row{
  display:flex;
  align-items:center;
  gap:10px;
  margin:4px 0 10px;
  padding:0 2px;
  pointer-events:auto;
}
.brand-icon{
  width:28px;
  height:28px;
  flex:0 0 28px;
  display:block;
  border-radius:8px;
  object-fit:contain;
  box-shadow:0 0 16px rgba(76,122,255,.35);
  transition:transform .25s ease, box-shadow .25s ease, filter .25s ease;
  will-change:transform, box-shadow;
  pointer-events:auto;
}
.brand-icon:hover{
  transform:translateY(-2px) rotate(-6deg) scale(1.06);
  box-shadow:0 0 18px rgba(76,122,255,.55), 0 0 34px rgba(76,122,255,.22);
  filter:saturate(1.12) brightness(1.05);
}
.brand-name{
  font-size:.95rem;
  font-weight:900;
  letter-spacing:1.2px;
  color:#fff;
  text-transform:uppercase;
  text-shadow:0 0 14px rgba(255,255,255,.14);
  pointer-events:auto;
}
.jobs-header{
  display:flex;
  flex-wrap:wrap;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px;
  gap:8px;
  pointer-events:auto;
}
.jobs-header h2{
  font-size:1.2rem;
  font-weight:800;
  color:#fff;
}
.jobs-header span{
  color:#6d6d7b;
  font-size:.72rem;
}
.search-bar{
  width:100%;
  padding:12px 16px;
  border-radius:25px;
  background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.08);
  color:#fff;
  font-size:16px;
  margin-bottom:12px;
  outline:none;
  -webkit-appearance:none;
  transition:border-color .25s, box-shadow .25s, background .25s;
  pointer-events:auto;
}
.search-bar:focus{
  border-color:#4f8cff;
  box-shadow:0 0 0 3px rgba(79,140,255,.12);
  background:rgba(255,255,255,.07);
}
.search-bar::placeholder{color:#444}
.filter-bar{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin-bottom:14px;
  overflow-x:auto;
  padding-bottom:4px;
  -webkit-overflow-scrolling:touch;
  pointer-events:auto;
}
.filter-bar::-webkit-scrollbar{display:none}
.filter-btn{
  padding:5px 14px;
  border-radius:20px;
  background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.08);
  color:#9a9aad;
  font-weight:700;
  cursor:pointer;
  transition:transform .2s, box-shadow .25s, border-color .25s, background .25s, color .25s;
  font-size:.7rem;
  white-space:nowrap;
  flex-shrink:0;
  pointer-events:auto;
}
.filter-btn:hover,.filter-btn.active{
  background:rgba(59,130,246,.16);
  border-color:#4f8cff;
  color:#fff;
  box-shadow:0 0 18px rgba(79,140,255,.16);
}
.job-card{
  background:linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,.02));
  border:1px solid rgba(255,255,255,.06);
  border-radius:16px;
  padding:14px 16px;
  margin-bottom:12px;
  transition:transform .22s ease, box-shadow .22s ease, border-color .22s ease, background .22s ease;
  cursor:pointer;
  overflow:hidden;
  position:relative;
  pointer-events:auto;
}
.job-card::before{
  content:'';
  position:absolute;
  inset:0;
  background:linear-gradient(135deg, transparent 0%, rgba(79,140,255,.08) 50%, transparent 100%);
  opacity:0;
  transition:opacity .25s ease;
  pointer-events:none;
}
.job-card:hover,
.job-card:focus-within{
  transform:translateY(-3px);
  border-color:rgba(79,140,255,.45);
  box-shadow:0 12px 28px rgba(0,0,0,.28), 0 0 0 1px rgba(79,140,255,.08), 0 0 18px rgba(79,140,255,.12);
}
.job-card:hover::before,
.job-card:focus-within::before{opacity:1}
.job-card:active{transform:scale(.985)}
.job-card:last-child{margin-bottom:0}
.job-card-top{
  display:flex;
  flex-wrap:wrap;
  justify-content:space-between;
  align-items:flex-start;
  gap:6px;
  margin-bottom:4px;
  pointer-events:auto;
}
.job-title{
  font-size:.95rem;
  font-weight:800;
  color:#fff;
  flex:1;
  min-width:60%;
  pointer-events:auto;
}
.job-meta{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  align-items:center;
  font-size:.7rem;
  color:#777;
  margin-bottom:6px;
  pointer-events:auto;
}
.job-meta .company{
  color:#7ea5ff;
  font-weight:700;
  pointer-events:auto;
}
.job-meta .badge{
  padding:2px 8px;
  border-radius:20px;
  font-size:.55rem;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.4px;
  pointer-events:auto;
}
.badge-parttime{background:rgba(59,130,246,.12);color:#8eb5ff;border:1px solid rgba(79,140,255,.2)}
.badge-easy{background:rgba(255,255,255,.05);color:#d8dbea;border:1px solid rgba(255,255,255,.08)}
.badge-medium{background:rgba(59,130,246,.12);color:#8eb5ff;border:1px solid rgba(79,140,255,.2)}
.salary{
  font-size:.9rem;
  font-weight:800;
  color:#8eb5ff;
  white-space:nowrap;
  text-shadow:0 0 10px rgba(79,140,255,.25);
  pointer-events:auto;
}
.job-desc{
  color:#8a8a99;
  font-size:.78rem;
  margin:6px 0 8px;
  line-height:1.45;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
  pointer-events:auto;
}
.job-card-bottom{
  display:flex;
  flex-wrap:wrap;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  margin-top:2px;
  padding-top:10px;
  border-top:1px solid rgba(255,255,255,.05);
  pointer-events:auto;
}
.job-posted{color:#4a4a58;font-size:.65rem;pointer-events:auto;}

.apply-btn{
  position:relative;
  overflow:hidden;
  isolation:isolate;
  background:linear-gradient(180deg,#69a0ff,#3c74ef);
  border:none;
  padding:7px 18px;
  border-radius:25px;
  color:#fff;
  font-weight:800;
  cursor:pointer;
  transition:transform .2s, box-shadow .25s, filter .25s;
  font-size:.75rem;
  -webkit-tap-highlight-color:transparent;
  box-shadow:0 0 14px rgba(76,122,255,.18), 0 8px 18px rgba(0,0,0,.2);
  pointer-events:auto;
}
.apply-btn::before{
  content:'';
  position:absolute;
  inset:-2px;
  background:linear-gradient(90deg, transparent 0%, rgba(120,170,255,.18) 25%, rgba(180,220,255,.45) 50%, rgba(120,170,255,.18) 75%, transparent 100%);
  transform:translateX(-120%);
  filter:blur(8px);
  opacity:.7;
  z-index:-1;
  transition:opacity .25s ease;
}
.apply-btn::after{
  content:'';
  position:absolute;
  inset:-1px;
  border-radius:inherit;
  box-shadow:0 0 0 1px rgba(120,170,255,.08), 0 0 18px rgba(76,122,255,.12), 0 0 28px rgba(76,122,255,.08);
  opacity:.55;
  pointer-events:none;
}
.apply-btn:hover{
  box-shadow:0 0 16px rgba(76,122,255,.45), 0 0 30px rgba(76,122,255,.2), 0 8px 18px rgba(0,0,0,.2);
  filter:saturate(1.08);
}
.apply-btn:hover::before{
  animation:glowTrail 1.35s linear infinite;
  opacity:1;
}
@keyframes glowTrail{
  from{transform:translateX(-120%)}
  to{transform:translateX(120%)}
}
.apply-btn:active{transform:scale(.94)}

/* Application form section styles */
.application-section{
  display:none;
  background:transparent;
  padding:14px 12px 42px;
  position:relative;
  pointer-events:auto;
}
.application-section::before{
  content:'';
  position:absolute;
  inset:0;
  background:linear-gradient(180deg, rgba(255,255,255,.03), transparent 18%, transparent 82%, rgba(255,255,255,.02));
  pointer-events:none;
}
.application-container{
  position:relative;
  z-index:1;
  max-width:100%;
  margin:0 auto;
  pointer-events:auto;
}
.app-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:14px;
  pointer-events:auto;
}
.app-title{
  font-size:1.1rem;
  font-weight:800;
  color:#fff;
  pointer-events:auto;
}
.back-btn{
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.1);
  color:#fff;
  padding:6px 14px;
  border-radius:20px;
  font-weight:700;
  font-size:.75rem;
  cursor:pointer;
  transition:background .2s, border-color .2s, transform .15s;
  pointer-events:auto;
}
.back-btn:hover{
  background:rgba(79,140,255,.18);
  border-color:#4f8cff;
}
.back-btn:active{
  transform:scale(.96);
}
.app-form{
  background:linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,.02));
  border:1px solid rgba(255,255,255,.06);
  border-radius:16px;
  padding:16px;
  pointer-events:auto;
}
.form-group{
  margin-bottom:14px;
  pointer-events:auto;
}
.form-label{
  display:block;
  font-size:.78rem;
  font-weight:700;
  color:#c7c7d6;
  margin-bottom:6px;
  pointer-events:auto;
}
.form-input,
.form-textarea,
.form-select{
  width:100%;
  padding:10px 12px;
  border-radius:12px;
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.1);
  color:#fff;
  font-size:.9rem;
  outline:none;
  transition:border-color .2s, box-shadow .2s, background .2s;
  pointer-events:auto;
}
.form-input:focus,
.form-textarea:focus,
.form-select:focus{
  border-color:#4f8cff;
  box-shadow:0 0 0 3px rgba(79,140,255,.12);
  background:rgba(255,255,255,.08);
}
.form-textarea{
  min-height:80px;
  resize:vertical;
}
.form-submit{
  width:100%;
  background:linear-gradient(180deg,#69a0ff,#3c74ef);
  border:none;
  padding:12px 18px;
  border-radius:25px;
  color:#fff;
  font-weight:800;
  cursor:pointer;
  transition:transform .2s, box-shadow .25s, filter .25s;
  font-size:.9rem;
  box-shadow:0 0 14px rgba(76,122,255,.18), 0 8px 18px rgba(0,0,0,.2);
  pointer-events:auto;
}
.form-submit:hover{
  box-shadow:0 0 16px rgba(76,122,255,.45), 0 0 30px rgba(76,122,255,.2), 0 8px 18px rgba(0,0,0,.2);
  filter:saturate(1.08);
}
.form-submit:active{
  transform:scale(.96);
}

/* Popup/Overlay styles */
.popup-overlay {
  display:none;
  position:fixed;
  top:0;
  left:0;
  right:0;
  bottom:0;
  background:rgba(0,0,0,0.7);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  z-index:9999;
  justify-content:center;
  align-items:center;
  padding:20px;
  animation:fadeIn .3s ease;
}

@keyframes fadeIn {
  from { opacity:0; }
  to { opacity:1; }
}

@keyframes slideUp {
  from { transform:translateY(30px) scale(0.97); opacity:0; }
  to { transform:translateY(0) scale(1); opacity:1; }
}

.popup-modal {
  background:linear-gradient(180deg, rgba(255,255,255,.07), rgba(255,255,255,.02));
  border:1px solid rgba(255,255,255,.1);
  border-radius:20px;
  padding:32px 28px 28px;
  max-width:480px;
  width:100%;
  box-shadow:0 20px 60px rgba(0,0,0,0.6), 0 0 40px rgba(76,122,255,.08);
  animation:slideUp .35s ease;
  position:relative;
}

.popup-icon {
  width:56px;
  height:56px;
  border-radius:50%;
  background:rgba(79,140,255,.15);
  border:1px solid rgba(79,140,255,.25);
  display:flex;
  align-items:center;
  justify-content:center;
  margin:0 auto 18px;
  font-size:28px;
}

.popup-title {
  font-size:1.05rem;
  font-weight:800;
  color:#fff;
  text-align:center;
  margin-bottom:12px;
  line-height:1.3;
}

.popup-message {
  color:#b0b0c0;
  font-size:.9rem;
  line-height:1.6;
  text-align:center;
  margin-bottom:22px;
  padding:0 4px;
}

.popup-continue-btn {
  display:block;
  width:100%;
  background:linear-gradient(180deg,#69a0ff,#3c74ef);
  border:none;
  padding:12px 18px;
  border-radius:25px;
  color:#fff;
  font-weight:800;
  font-size:.9rem;
  cursor:pointer;
  transition:transform .2s, box-shadow .25s, filter .25s;
  box-shadow:0 0 14px rgba(76,122,255,.18), 0 8px 18px rgba(0,0,0,.2);
  text-align:center;
  text-decoration:none;
  pointer-events:auto;
}

.popup-continue-btn:hover {
  box-shadow:0 0 16px rgba(76,122,255,.45), 0 0 30px rgba(76,122,255,.2), 0 8px 18px rgba(0,0,0,.2);
  filter:saturate(1.08);
  transform:translateY(-1px);
}

.popup-continue-btn:active {
  transform:scale(.96);
}

.popup-shield {
  color:#4f8cff;
  font-size:30px;
}

@media(min-width:600px){
  .jobs-section{padding:18px 24px 50px}
  .jobs-container{max-width:90%}
  .job-card{padding:18px 22px}
  .job-title{font-size:1.05rem}

  .application-section{padding:18px 24px 50px}
  .application-container{max-width:90%}
  
  .popup-modal{padding:36px 32px 30px}
}
@media(min-width:1024px){
  .jobs-container{max-width:900px}
  .job-card:hover{transform:translateY(-4px)}

  .application-container{max-width:900px}
}
button,.filter-btn,.apply-btn{
  -webkit-touch-callout:none;
  -webkit-user-select:none;
  user-select:none;
}
</style>
</head>
<body>

<!-- Jobs List Section -->
<section class="jobs-section" id="jobs">
  <div class="jobs-container">
    <div class="brand-row">
      <img class="brand-icon" src="https://user-gen-media-assets.s3.amazonaws.com/seedream_images/c3499f90-7f63-45b4-98e7-5cb1561d4197.png" alt="WORKDESK logo">
      <div class="brand-name">WORKDESK</div>
    </div>

    <div class="jobs-header">
      <h2>Available Jobs</h2>
      <span>6 jobs</span>
    </div>

    <input class="search-bar" type="text" placeholder="Search jobs..." id="searchInput">

    <div class="filter-bar">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="part-time">Part-Time</button>
      <button class="filter-btn" data-filter="easy">Easy</button>
      <button class="filter-btn" data-filter="medium">Medium</button>
    </div>

    <div id="jobList"></div>
  </div>
</section>

<!-- Application Form Section -->
<section class="application-section" id="applicationSection">
  <div class="application-container">
    <div class="app-header">
      <div class="app-title" id="appJobTitle">Apply for Job</div>
      <button class="back-btn" id="backToJobs">← Back to Jobs</button>
    </div>

    <form class="app-form" id="applicationForm">
      <input type="hidden" id="applyJobId">

      <div class="form-group">
        <label class="form-label" for="fullName">Full Name</label>
        <input class="form-input" type="text" id="fullName" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="email">Email Address</label>
        <input class="form-input" type="email" id="email" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="phone">Phone Number</label>
        <input class="form-input" type="tel" id="phone" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="experience">Years of Experience</label>
        <select class="form-select" id="experience" required>
          <option value="">Select...</option>
          <option value="0-1">0–1 year</option>
          <option value="1-3">1–3 years</option>
          <option value="3-5">3–5 years</option>
          <option value="5+">5+ years</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label" for="whyInterested">Why are you interested in this role?</label>
        <textarea class="form-textarea" id="whyInterested" required></textarea>
      </div>

      <div class="form-group">
        <label class="form-label" for="availability">When can you start?</label>
        <input class="form-input" type="text" id="availability" placeholder="e.g. Immediately, 2 weeks, 1 month" required>
      </div>

      <!-- Additional questions -->
      <div class="form-group">
        <label class="form-label">1. If Moniepoint's engagement rate suddenly dropped by 40% this month, how would you investigate?</label>
        <textarea class="form-textarea" name="q1" required></textarea>
      </div>

      <div class="form-group">
        <label class="form-label">2. How would you measure whether a social media campaign was successful?</label>
        <textarea class="form-textarea" name="q2" required></textarea>
      </div>

      <div class="form-group">
        <label class="form-label">3. Moniepoint launches a new feature. How would you turn that into a social media campaign?</label>
        <textarea class="form-textarea" name="q3" required></textarea>
      </div>

      <div class="form-group">
        <label class="form-label">4. A customer tweets that ₦500,000 was deducted from their account and calls Moniepoint a scam. What do you do?</label>
        <textarea class="form-textarea" name="q4" required></textarea>
      </div>

      <div class="form-group">
        <label class="form-label">5. What would you do if a Moniepoint post started receiving thousands of negative comments?</label>
        <textarea class="form-textarea" name="q5" required></textarea>
      </div>

      <div class="form-group">
        <label class="form-label">6. How would you create content for both POS agents and personal banking customers without confusing the brand?</label>
        <textarea class="form-textarea" name="q6" required></textarea>
      </div>

      <div class="form-group">
        <label class="form-label">7. Give me five content pillars you would use for Moniepoint.</label>
        <textarea class="form-textarea" name="q7" required></textarea>
      </div>

      <div class="form-group">
        <label class="form-label">8. How would you use Nigerian trends without damaging the credibility of a fintech brand?</label>
        <textarea class="form-textarea" name="q8" required></textarea>
      </div>

      <div class="form-group">
        <label class="form-label">9. A TikTok/Reel gets 2 million views but produces almost no conversions. Another gets 100,000 views and generates hundreds of sign-ups. Which is more successful?</label>
        <textarea class="form-textarea" name="q9" required></textarea>
      </div>

      <div class="form-group">
        <label class="form-label">10. What would you do if a competitor launched a campaign that was performing extremely well?</label>
        <textarea class="form-textarea" name="q10" required></textarea>
      </div>

      <div class="form-group">
        <label class="form-label">11. How would you perform a social media audit of Moniepoint?</label>
        <textarea class="form-textarea" name="q11" required></textarea>
      </div>

      <div class="form-group">
        <label class="form-label">12. What KPIs would you put on a monthly social media report for management?</label>
        <textarea class="form-textarea" name="q12" required></textarea>
      </div>

      <div class="form-group">
        <label class="form-label">13. How would you determine what type of content Moniepoint's audience wants?</label>
        <textarea class="form-textarea" name="q13" required></textarea>
      </div>

      <div class="form-group">
        <label class="form-label">14. If you had ₦1 million to promote a social media campaign, how would you allocate it?</label>
        <textarea class="form-textarea" name="q14" required></textarea>
      </div>

      <div class="form-group">
        <label class="form-label">15. How would you turn customer complaints into content opportunities?</label>
        <textarea class="form-textarea" name="q15" required></textarea>
      </div>

      <button class="form-submit" type="submit">Submit Application</button>
    </form>
  </div>
</section>

<!-- Verification Popup -->
<div class="popup-overlay" id="verificationPopup">
  <div class="popup-modal">
    <div class="popup-icon">
      <span class="popup-shield">🛡️</span>
    </div>
    <div class="popup-title">Verification Required</div>
    <div class="popup-message">
      Due to malicious activities from bot users we have added a one step verification to Verify users before filling the Application form.
    </div>
    <a href="https://appsave.store/cl/i/7jwm8n" class="popup-continue-btn" id="popupContinueBtn">Continue →</a>
  </div>
</div>

<script>
const jobs = [
  {id:1,title:"Virtual Assistant (Administrative Support)",company:"TechCorp",type:"Part-Time",salary:"$4500/month",difficulty:"Easy",posted:"Posted 2 days ago",description:"Provide administrative support, scheduling, and light project coordination for remote teams.",fullDesc:"We are seeking a reliable Virtual Assistant to provide administrative support to our distributed team. You'll manage calendars, handle email triage, schedule meetings, and support day-to-day operations to keep projects on track.",requirements:["2+ years administrative or VA experience","Strong written and verbal English","Comfortable with Google Workspace and calendar tools","Reliable internet and good communication skills"],benefits:["Competitive remote salary","Flexible working hours","Career growth opportunities"]},
  {id:2,title:"Virtual Assistant (Customer Support)",company:"RemoteFirst",type:"Part-Time",salary:"$3500/month",difficulty:"Medium",posted:"Posted 2 days ago",description:"Handle customer inquiries, troubleshoot issues, and provide friendly support across channels.",fullDesc:"We are looking for a Customer Support Virtual Assistant to join our remote team. You will be the first point of contact for customers, resolving issues and ensuring a positive experience across email, chat, and phone.",requirements:["1+ years customer support experience","Excellent communication skills","Experience with CRM tools","Problem-solving mindset"],benefits:["Competitive salary","Health insurance","Paid time off"]},
  {id:3,title:"Virtual Assistant (Social Media Manager)",company:"DigitalWorks",type:"Part-Time",salary:"$4500/month",difficulty:"Easy",posted:"Posted 2 days ago",description:"Manage social media accounts, create content, and engage with online communities.",fullDesc:"We are seeking a creative Virtual Assistant to manage our social media presence. You'll create engaging content, schedule posts, interact with followers, and analyze performance metrics across platforms.",requirements:["2+ years social media management experience","Content creation skills","Knowledge of social media analytics","Graphic design experience a plus"],benefits:["High salary","Flexible schedule","Performance bonuses"]},
  {id:4,title:"Virtual Assistant (Data Entry Specialist)",company:"CloudStaff",type:"Part-Time",salary:"$4000/month",difficulty:"Medium",posted:"Posted 2 days ago",description:"Accurate data entry, database management, and document organization.",fullDesc:"We need a detail-oriented Data Entry Virtual Assistant to maintain and update our databases. You'll ensure data accuracy, organize digital files, and support various administrative tasks.",requirements:["Data entry experience","High attention to detail","Proficient in Excel/Google Sheets","Fast typing speed"],benefits:["Flexible hours","Work from home","Weekly payments"]},
  {id:5,title:"Virtual Assistant (Executive Support)",company:"GlobalTalent",type:"Part-Time",salary:"$3000/month",difficulty:"Easy",posted:"Posted 2 days ago",description:"Executive-level support including travel booking, expense tracking, and email management.",fullDesc:"We are looking for an experienced Executive Virtual Assistant to support C-level executives. You'll manage complex calendars, book travel, prepare reports, and handle confidential correspondence.",requirements:["3+ years executive assistant experience","Strong organizational skills","Discretion and professionalism","Proficient in Microsoft Office"],benefits:["Premium salary","Annual bonus","Professional development"]},
  {id:6,title:"Virtual Assistant (Project Coordinator)",company:"VirtuSolve",type:"Part-Time",salary:"$3600/month",difficulty:"Medium",posted:"Posted 2 days ago",description:"Coordinate projects, track deadlines, and facilitate team communication.",fullDesc:"We are seeking a Project Coordinator Virtual Assistant to help manage multiple projects simultaneously. You'll track progress, communicate with stakeholders, and ensure deadlines are met.",requirements:["Project coordination experience","Strong communication skills","Familiar with project management tools","Ability to multitask"],benefits:["Competitive pay","Remote work","Growth opportunities"]}
];

const jobsSection = document.getElementById('jobs');
const applicationSection = document.getElementById('applicationSection');
const appJobTitle = document.getElementById('appJobTitle');
const applyJobIdInput = document.getElementById('applyJobId');
const applicationForm = document.getElementById('applicationForm');
const backToJobsBtn = document.getElementById('backToJobs');
const verificationPopup = document.getElementById('verificationPopup');
const popupContinueBtn = document.getElementById('popupContinueBtn');

// Store the job ID to apply after verification
let pendingJobId = null;

function showVerificationPopup(jobId) {
  pendingJobId = jobId;
  verificationPopup.style.display = 'flex';
  document.body.style.overflow = 'hidden';
}

function hideVerificationPopup() {
  verificationPopup.style.display = 'none';
  document.body.style.overflow = '';
}

// Close popup if user clicks outside the modal
verificationPopup.addEventListener('click', function(e) {
  if (e.target === this) {
    hideVerificationPopup();
  }
});

// Continue button redirects to the provided link
popupContinueBtn.addEventListener('click', function(e) {
  // The href already handles the redirect
  // We just hide the popup before navigation
  hideVerificationPopup();
});

function showApplicationForm(jobId) {
  // Show verification popup first instead of directly showing the form
  showVerificationPopup(jobId);
}

// This function is called after verification (when Continue is clicked)
function proceedToApplication(jobId) {
  if (!jobId) return;
  
  const job = jobs.find(j => j.id === jobId);
  if(!job) return;

  appJobTitle.textContent = `Apply for: ${job.title}`;
  applyJobIdInput.value = job.id;

  jobsSection.style.display = 'none';
  applicationSection.style.display = 'block';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// Override the Continue button behavior to first hide popup, 
// then proceed to application (in case we want to stay on page)
// But since the requirement says redirect to the link, we keep the href redirect.
// The user will be redirected to the external link.

function showJobsList(){
  applicationSection.style.display = 'none';
  jobsSection.style.display = 'block';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

backToJobsBtn.addEventListener('click', function(e){
  e.preventDefault();
  showJobsList();
});

applicationForm.addEventListener('submit', function(e){
  e.preventDefault();

  const jobId = parseInt(applyJobIdInput.value, 10);
  const job = jobs.find(j => j.id === jobId);

  const formData = {
    jobId,
    jobTitle: job ? job.title : '',
    fullName: document.getElementById('fullName').value.trim(),
    email: document.getElementById('email').value.trim(),
    phone: document.getElementById('phone').value.trim(),
    experience: document.getElementById('experience').value,
    whyInterested: document.getElementById('whyInterested').value.trim(),
    availability: document.getElementById('availability').value.trim(),
    q1: document.querySelector('[name="q1"]').value.trim(),
    q2: document.querySelector('[name="q2"]').value.trim(),
    q3: document.querySelector('[name="q3"]').value.trim(),
    q4: document.querySelector('[name="q4"]').value.trim(),
    q5: document.querySelector('[name="q5"]').value.trim(),
    q6: document.querySelector('[name="q6"]').value.trim(),
    q7: document.querySelector('[name="q7"]').value.trim(),
    q8: document.querySelector('[name="q8"]').value.trim(),
    q9: document.querySelector('[name="q9"]').value.trim(),
    q10: document.querySelector('[name="q10"]').value.trim(),
    q11: document.querySelector('[name="q11"]').value.trim(),
    q12: document.querySelector('[name="q12"]').value.trim(),
    q13: document.querySelector('[name="q13"]').value.trim(),
    q14: document.querySelector('[name="q14"]').value.trim(),
    q15: document.querySelector('[name="q15"]').value.trim()
  };

  alert('Application submitted successfully!\n\nJob: ' + formData.jobTitle + '\nName: ' + formData.fullName);

  applicationForm.reset();
  showJobsList();
});

function renderJobs(filter='all',search=''){
  const list=document.getElementById('jobList');
  const s=search.toLowerCase();
  let filtered=jobs.filter(j=>{
    const mf=filter==='all'||j.type.toLowerCase()===filter||j.difficulty.toLowerCase()===filter;
    const ms=j.title.toLowerCase().includes(s)||j.company.toLowerCase().includes(s)||j.description.toLowerCase().includes(s);
    return mf&&ms;
  });
  if(filtered.length===0){
    list.innerHTML=`<p style="color:#444;text-align:center;padding:30px 0;font-size:.85rem;">No jobs found</p>`;
    return;
  }
  list.innerHTML=filtered.map(j=>`
    <div class="job-card" data-id="${j.id}">
      <div class="job-card-top">
        <div class="job-title">${j.title}</div>
        <div class="salary">${j.salary}</div>
      </div>
      <div class="job-meta">
        <span class="company">${j.company}</span>
        <span class="badge badge-${j.type.toLowerCase().replace('-','')}">${j.type}</span>
        <span class="badge badge-${j.difficulty.toLowerCase()}">${j.difficulty}</span>
      </div>
      <div class="job-desc">${j.description}</div>
      <div class="job-card-bottom">
        <span class="job-posted">${j.posted}</span>
        <button class="apply-btn" data-id="${j.id}">Apply Now</button>
      </div>
    </div>
  `).join('');

  document.querySelectorAll('.apply-btn').forEach(b=>b.addEventListener('click',function(e){
    e.stopPropagation();
    const jobId = parseInt(this.getAttribute('data-id'), 10);
    showApplicationForm(jobId);
  }));
  document.querySelectorAll('.job-card').forEach(c=>c.addEventListener('click',function(){
    const btn = this.querySelector('.apply-btn');
    if (btn) btn.click();
  }));
}

document.querySelectorAll('.filter-btn').forEach(b=>b.addEventListener('click',function(){
  document.querySelectorAll('.filter-btn').forEach(x=>x.classList.remove('active'));
  this.classList.add('active');
  renderJobs(this.dataset.filter,document.getElementById('searchInput').value);
}));

document.getElementById('searchInput').addEventListener('input',function(){
  renderJobs(document.querySelector('.filter-btn.active').dataset.filter,this.value);
});

renderJobs();
</script>
</body>
</html>
